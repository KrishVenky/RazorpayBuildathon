<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS.402 - Decentralized Agent Labor Market</title>
  <meta name="description" content="Agent-to-agent labor market on Solana. Quant Agent hires Analyst Agent via x402 HTTP payment protocol with trustless Anchor escrow." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />

  <style>
    #loading-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #loading-logo span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #f1f5f9;
    }
    #loading-logo .dot { color: #60a5fa; }
    #loading-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.16em;
      color: #475569;
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="loading-screen">
      <div id="loading-logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <rect width="24" height="24" rx="6" fill="url(#logo-grad)"/>
          <defs>
            <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#3b82f6"/>
              <stop offset="100%" stop-color="#a78bfa"/>
            </linearGradient>
          </defs>
          <path d="M13 5 5 13h5.5l-1 6 8-9H12l1-5Z" fill="white"/>
        </svg>
        <span>NEXUS<span class="dot">.</span>402</span>
      </div>
      <svg class="spin" width="20" height="20" viewBox="0 0 24 24" fill="none" style="color:#60a5fa">
        <circle cx="12" cy="12" r="9" stroke="rgba(96,165,250,0.2)" stroke-width="2"/>
        <path d="M21 12a9 9 0 0 0-9-9" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span id="loading-sub">INITIALIZING</span>
    </div>
  </div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <script src="/js/data.js"></script>
  <script type="text/babel" data-presets="react" src="/js/components.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/x402-flow.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/dashboard.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/agents.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/escrow.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/app.jsx"></script>
</body>
</html>
